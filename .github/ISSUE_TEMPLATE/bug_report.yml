name: Bug report / 缺陷报告
description: Report a reproducible problem. 报告可复现的问题。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Knowledge Workbench. Please remove private data before submitting.
  - type: textarea
    id: description
    attributes:
      label: Problem / 问题描述
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction / 复现步骤
      placeholder: "1. Start with…\n2. Click…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      placeholder: Windows 11, Node.js 22.23.2, Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / 相关日志
      description: Remove credentials, internal addresses, document content, and other sensitive data.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私确认
      options:
        - label: I removed passwords, tokens, personal data, private URLs, and business data. / 我已移除密码、令牌、个人信息、私有地址和业务数据。
          required: true
